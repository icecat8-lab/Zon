name: Build Zon APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Get current date
      id: date
      run: echo "date=$(date +'%Y%m%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Rename APK
      run: |
        mkdir -p release-output
        cp app/build/outputs/apk/debug/app-debug.apk release-output/Zon-${{ steps.date.outputs.date }}.apk

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zon-APK-${{ steps.date.outputs.date }}
        path: release-output/Zon-${{ steps.date.outputs.date }}.apk

    - name: Create Release
      uses: softprops/action-gh-release@v2
      if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.event_name == 'workflow_dispatch'
      with:
        tag_name: build-${{ steps.date.outputs.date }}
        name: Zon Build ${{ steps.date.outputs.date }}
        body: |
          Zon File Manager - Auto Build
          Build Date: ${{ steps.date.outputs.date }}
        files: release-output/Zon-${{ steps.date.outputs.date }}.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
